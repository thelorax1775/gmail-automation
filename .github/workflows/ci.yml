name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest version the README promises and the newest stable release.
        include:
          - python-version: "3.15"
            source: setup-python
          # setup-python has no Python 3.9 build for the current ubuntu-latest
          # image (Ubuntu 26.04), so 3.9 comes from uv's standalone builds.
          - python-version: "3.9"
            source: uv
    steps:
      - uses: actions/checkout@v7
      - if: matrix.source == 'setup-python'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - if: matrix.source == 'uv'
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false
      - if: matrix.source == 'uv'
        name: Create a Python ${{ matrix.python-version }} environment with pip
        run: |
          uv venv --seed --python "${{ matrix.python-version }}" "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Check the Python version
        run: python --version | grep -F "Python ${{ matrix.python-version }}."
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  make:
    name: make install and make test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: make install
      - run: make test
      - name: make run starts the script with the venv's Python
        # No client secret and no token exist here, so a run that gets past its
        # imports and the config must stop at the missing client secret. The
        # runner's own Python has none of the packages, so this fails if
        # `make run` does not use the venv.
        run: |
          cp config.yaml.example config.yaml
          if make run > run.log 2>&1 < /dev/null; then
            cat run.log
            echo "make run succeeded without a client secret"
            exit 1
          fi
          cat run.log
          grep -F "Missing client secrets file" run.log
